name: Build mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7

      - name: Configure haxelib
        run: |
          mkdir -p "$HOME/haxelib"
          haxelib setup "$HOME/haxelib"

      - name: Install HLX dependencies
        run: |
          haxelib git hlx-runtime https://github.com/hlx-framework/hlx-core.git main hlx-runtime/src

      - name: Compile
        run: haxe compile.hxml

      - name: Package
        run: |
          mkdir -p package/hlx/mods/disable-profanity-filter
          cp build/disable-profanity-filter/disable-profanity-filter.hl package/hlx/mods/disable-profanity-filter/
          cp configFormats.json package/hlx/mods/disable-profanity-filter/
          printf "Requires HLX Core and the Farever ImGui plugin.\nInstall with Vortex, or extract the archive into the Farever game folder.\n" > package/hlx/mods/disable-profanity-filter/README.txt
          cd package
          zip -r ../farever-disable-profanity-filter.zip hlx

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: farever-disable-profanity-filter
          path: farever-disable-profanity-filter.zip
